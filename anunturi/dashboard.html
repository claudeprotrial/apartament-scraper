<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anunțuri Berna — spații comerciale de închiriat</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#16181d; --ink2:#5b626e; --ink3:#8a919e;
  --line:#e2e5ea; --accent:#1f6feb; --accent-ink:#fff;
  --a-cat:#7a3ea3; --a-cat-bg:#f3e9fa; --b-cat:#1d6f5c; --b-cat-bg:#e3f4ee;
  --praxis:#a8590a; --praxis-bg:#fdf0e0; --star:#e0a800;
  --shadow:0 1px 2px rgba(16,20,28,.06),0 4px 12px rgba(16,20,28,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101216; --card:#181b21; --ink:#e8eaee; --ink2:#a3abb8; --ink3:#767e8b;
    --line:#272b33; --accent:#4c8dff; --accent-ink:#0b1220;
    --a-cat:#d2a8f0; --a-cat-bg:#2e2038; --b-cat:#7fd8bd; --b-cat-bg:#152e28;
    --praxis:#f0b878; --praxis-bg:#33240f; --star:#f0c443;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--accent)}

/* ---- bara de sus ---- */
header{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:14px 20px 12px}
/* Pe ecrane inguste sau scunde controalele se aseaza pe multe randuri, iar un
   antet lipit ajunge mai inalt decat fereastra si acopera tot. Il lasam sa
   plece la derulare. */
@media (max-width:700px),(max-height:620px){header{position:static}}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:11px}
h1{font-size:17px;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink3);font-size:13px}
.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
#q{flex:1 1 300px;min-width:200px;padding:9px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--card);color:var(--ink);font-size:14px}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);color:var(--ink);font-size:13px}
.chip{padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);
  color:var(--ink2);font-size:13px;cursor:pointer;user-select:none;white-space:nowrap}
.chip:hover{border-color:var(--ink3)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.count{color:var(--ink3);font-size:13px;margin-left:auto;white-space:nowrap}

/* ---- grila ---- */
main{padding:18px 20px 60px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden;
  cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;
  transition:transform .12s ease, box-shadow .12s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(16,20,28,.1),0 12px 28px rgba(16,20,28,.09)}
.thumb{aspect-ratio:4/3;background:var(--line);position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.nimg{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.62);color:#fff;
  font-size:11px;padding:2px 7px;border-radius:99px;backdrop-filter:blur(3px)}
.star{position:absolute;left:7px;top:7px;width:29px;height:29px;border:0;border-radius:50%;
  background:rgba(0,0,0,.45);color:#fff;font-size:15px;cursor:pointer;line-height:29px;
  padding:0;backdrop-filter:blur(3px)}
.star.on{color:var(--star)}
.body{padding:12px 13px 13px;display:flex;flex-direction:column;gap:7px;flex:1}
.badges{display:flex;gap:5px;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;letter-spacing:.01em}
.badge.A{background:var(--a-cat-bg);color:var(--a-cat)}
.badge.B{background:var(--b-cat-bg);color:var(--b-cat)}
.badge.px{background:var(--praxis-bg);color:var(--praxis)}
.badge.tip{background:var(--line);color:var(--ink2)}
.ctitle{font-weight:600;font-size:14.5px;line-height:1.35;margin:0}
.cmeta{color:var(--ink2);font-size:12.5px}
.cprice{margin-top:auto;padding-top:6px;font-size:13px;color:var(--ink);font-weight:600}
.csnip{color:var(--ink3);font-size:12.5px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
mark{background:#ffe9a8;color:#3a2c00;border-radius:2px;padding:0 1px}
@media (prefers-color-scheme:dark){mark{background:#5d4a12;color:#ffe9a8}}
.empty{text-align:center;color:var(--ink3);padding:70px 20px}

/* ---- detaliu ---- */
#ov{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.6);
  backdrop-filter:blur(3px);display:none;padding:26px}
#ov.open{display:block}
.panel{background:var(--bg);max-width:1180px;height:100%;margin:0 auto;border-radius:13px;
  overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.phead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);
  background:var(--card)}
.phead h2{font-size:15px;margin:0;flex:1;font-weight:600;line-height:1.4}
.nav{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:7px;
  padding:6px 11px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--ink3);color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.pbody{flex:1;overflow:auto;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
@media (max-width:900px){.pbody{grid-template-columns:1fr}#ov{padding:0}.panel{border-radius:0}}
.gal{padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.gal figure{margin:0}
.gal img{width:100%;border-radius:9px;display:block;background:var(--line)}
.gal figcaption{color:var(--ink3);font-size:12px;margin-top:5px}
.txt{padding:16px 18px 40px;border-left:1px solid var(--line);min-width:0;background:var(--card)}
@media (max-width:900px){.txt{border-left:0;border-top:1px solid var(--line)}}
.txt h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);
  margin:22px 0 9px;font-weight:600}
.txt h3:first-child{margin-top:0}
.desc{white-space:pre-wrap;font-size:14.5px;line-height:1.62}
.desc strong{font-weight:600}
table{border-collapse:collapse;width:100%;font-size:13px}
td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--ink3);width:44%;padding-right:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--line);color:var(--ink2);font-size:12px;padding:3px 9px;border-radius:99px}
kbd{background:var(--line);border-radius:4px;padding:1px 5px;font-size:11px;font-family:inherit}
.hint{color:var(--ink3);font-size:12px;padding:10px 20px 26px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="top">

    </div>
  </div>
  <div class="pbody"><div class="gal" id="dgal"></div><div class="txt" id="dtxt"></div></div>
</div></div>

 Liegenschaft - beste Voraussetzungen für reibungsloses Arbeiten und Cloud-Anwendungen.\n*   **Haustiere:** Nach Absprache (z. B. als Begleitung im Büro) erlaubt.\n\n**LAGE & ERREICHBARKEIT (WIRTSCHAFTSREGION)**  \n  \n\n*   **Perfekt für Kunden & Partner:** Die regionalen Wirtschaftszentren sind in wenigen Autominuten schnell erreicht:\n*   **Unter 10 Min.:** Aarwangen (5 Min.), Wynau (5 Min.), St. Urban (6 Min.), Langenthal (7 Min.) und Murgenthal (9 Min.).\n*   **In 10-15 Min.:** Rothrist (11 Min.) und Niederbipp (15 Min.).\n*   **Unter 20 Min.:** Oensingen (16 Min.) und Dagmersellen (18 Min.).\n*   **In ca. 20 Min.:** Olten (20 Min.) und Zofingen (21 Min.).\n*   **Grosstadtanbindung:** Ideale Erreichbarkeit über den nahen Autobahnanschluss A1 nach Bern (ca. 45 Min.), Basel (ca. 45 Min.) und Zürich (ca. 50 Min.). Der Bahnhof Roggwil ist bequem zu Fuss erreichbar.\n\n**KONDITIONEN**  \n  \n\n*   **Monatsmiete:** CHF 530.- Brutto (aufgeteilt in CHF 420.- Netto + CHF 110.- Nebenkosten).\n*   **Parken:** Ein Abstellplatz direkt vor dem Haus kann für CHF 50.-/Monat dazu gemietet werden.\n*   **Bezug:** Per sofort oder nach Vereinbarung.\n\nGerne zeigen wir Ihnen die Räumlichkeiten gerne persönlichen. Wir freuen uns auf Ihre Kontaktaufnahme!  \n  \n**Wohnen & Arbeiten kombinieren:**  \nSuchen Sie den perfekten Ort, um Arbeiten, Freizeit und Wohnen ideal zu verbinden? Neben dieser flexibel nutzbaren Gewerbe- und Hobbyfläche bieten wir im 1. Oberschoss zeitgleich attraktive Wohnungen zur Miete **CHF 1'395.- inkl. Nebenkosten** an. Die Einheiten verfügen über jeweils 3.5 Zimmer mit grosszügigen Raumhöhen, die für ein modernes und luftiges Wohngefühl auf 60 m² Wohnfläche sorgen.  \n  \n**Ihre Vorteile im Überblick:**  \n  \n\n*   **Klimaanlage & Raumklima**: Dank den installierten Klimaanlagen geniessen Sie hier selbst bei heissen Aussentemperaturen stets angenehm kühle und perfekt temperierte Räume.\n*   **Moderne Ausstattung**: Die Küchen der Wohnungen sind mit komfortablen Geschirrspülern ausgestattet. Im Keller stehen zudem moderne Waschmaschinen und Trockner zur Mitbenutzung bereit.\n*   **Gemeinschaft & Aussenbereich**: Ein gemeinsamer Sitzplatz im Freien lädt zu erholsamen Stunden und gemütlichem Beisammensein ein.\n*   **Parkplätze & Haustiere**: Für Ihre Fahrzeuge sind Parkplätze direkt bei der Liegenschaft vorhanden. Zudem sind Ihre geliebten Haustiere in den Wohnungen herzlich willkommen.\n\nNutzen Sie diese seltene Gelegenheit, Ihr Gewerbe oder Hobby direkt mit einem neuen Zuhause am selben Standort zu kombinieren. Für nähere Angaben stehen wir Ihnen gerne zur Verfügung.","oras":"Roggwil","npa":4914,"strada":"Weibelackerweg 3","tip":"COMMERCIAL","tipDe":"Gewerbe","catObj":"INDUSTRY","pret":"CHF 530 inkl. NK pro Monat","rentNet":null,"rentNK":110,"rentBrut":530,"supr":50,"camere":null,"etaj":-1,"anCons":1908,"anRenov":2026,"disponibil":"imm","referinta":"","agentie":"","agentieLoc":"","dotari":["Parkplatz","Geschirrspüler","Kabelanschluss","Parkettboden","Tumbler","Waschmaschine","Haustiere erlaubt"],"url":"https://flatfox.ch/de/wohnung/weibelackerweg-3-4914-roggwil/86055759/","folder":"B_buero_gewerbe/86055759-roggwil-50m-gewerbe","imagini":[{"f":"01.jpg","cap":"Atelier: Viel Platz für Ihre Ideen: Frisch teilrenovierter, heller Atelier- und Arbeitsraum mit gemütlichem Charme im Untergeschoss","w":1500,"h":1125},{"f":"02.jpg","cap":"Atelier: Separater Eingang für Sie und Ihre Kunden – direkt neben dem überdachten Aussenbereich","w":1125,"h":1500},{"f":"03.jpg","cap":"Atelier: Praktisch und modern: Die separate Küche bietet zusätzlichen Komfort direkt in Ihrer Gewerbeeinheit","w":1500,"h":1125},{"f":"04.jpg","cap":"Atelier: Moderner Sanitärbereich direkt auf der Fläche – ideal für die geschäftliche oder private Nutzung","w":1125,"h":1500},{"f":"05.jpg","cap":"Viel Platz für Ihre Hobbys: Grosszügige Kellerräume, moderne Waschküche und optional zumietbares Atelier mit eigener Infrastruktur.","w":1348,"h":1052},{"f":"06.jpg"," arkplätze direkt am Gebäude sorgen dafür, dass auch Besucher und Kundinnen unkompliziert und kostenlos parkieren können.   \n  \n**Die Büroflächen**   \n  \nIm 3. Obergeschoss des Gebäudes erwarten Sie exklusive, private Büroflächen, die ausschliesslich über einen persönlichen Schlüssel und separaten Eingang zugänglich sind. Das gesamte Stockwerk steht Ihnen zur alleinigen Nutzung zur Verfügung, diskret, sicher und vollständig auf Ihre Bedürfnisse ausgerichtet. Die hellen, autonomen Bürozimmer sind entlang zwei parallel verlaufender Korridore angeordnet. Dank grosszügiger Fensterfronten auf beiden Gebäudeseiten profitieren alle Räume von natürlichem Tageslicht und einer angenehmen, produktiven Arbeitsatmosphäre. Im zentralen Bereich zwischen den Bürozimmern und den Korridoren befinden sich die gemeinschaftlichen Einrichtungen: zwei separate WC-Anlagen sowie ein Putzraum. Alles ist zentral gelegen, gepflegt und für alle Nutzer des Stockwerks bequem erreichbar.   \n  \n**Infrastruktur & Umfeld **   \n  \nDie Lage im Industriegebiet Neuhof bietet eine ruhige, konzentrierte Arbeitsatmosphäre fernab von städtischem Lärm und Trubel. Dennoch fehlt es nicht an Versorgung: Restaurants, Einkaufsmöglichkeiten und weitere Dienstleister befinden sich in unmittelbarer Nähe und machen den Arbeitsalltag angenehm. Das Gewerbequartier ist seit Jahren gewachsen und beherbergt eine Vielzahl etablierter Unternehmen, ein Umfeld, das Seriosität und Stabilität ausstrahlt.   \n  \n**Warum Kirchberg?**   \n  \nDer Kanton Bern bietet Unternehmen stabile und verlässliche Rahmenbedingungen. Kirchberg als Gewerbestandort verbindet die Nähe zur Bundesstadt mit einem deutlich günstigeren Kostenniveau, sowohl bei den Mietpreisen als auch im allgemeinen Betrieb. Wer in Kirchberg mietet, gewinnt Fläche, Flexibilität und eine hervorragende Anbindung, ohne die hohen Kosten eines Stadtstandorts tragen zu müssen.","oras":"Kirchberg BE","npa":3422,"strada":"Industrie Neuhof 78","tip":"COMMERCIAL","tipDe": ohnung nutzen. Seit 2013 werden die beiden obersten Stockwerke als stilvolle Event-Location genutzt.   \n  \nUnverkennbare Architektur   \nDer terrassierte Eisenbetonbau unter schwach geneigten Betondächern mit Oberlichtern verfügt über eine mittig angelegte Erschliessungsachse mit Schräglift für den Warentransport. Daran angegliedert ist ein turmartiger Baukörper, der die gestufte Anlage spannungsvoll durchbricht.   \n  \nNettomiete: CHF 3'500.- (inkl. Parkplätze)   \nNebenkosten akonto: CHF 700.-   \n  \n  \n  \nRaumbeschrieb   \n  \nDiese einzigartige Lofteinheit befindet sich in der dritten Etage, auf der rechten Gebäudeseite und verbindet auf eindrucksvolle Weise industriellen Charakter mit moderner, minimalistischer Architektur. Die Kombination aus grosszügiger Raumwirkung, viel Tageslicht und klarer Gestaltung macht diese Einheit zu einem besonderen Ort für berufliche, kreative oder wohnähnliche Nutzungen.   \n  \nDie Highlights auf einen Blick:   \nLichtdurchfluteter, grosszügiger Loft-/Atelierraum auf 179 m².   \nBeeindruckende Raumhöhe und viele grosse Fenster und Oblichter, die ein einzigartiges Lichtspiel erzeugen und dem Raum Grosszügigkeit verleihen.   \nDrei abgeschlossene Räume, ergänzt durch einen kleiner Rückzugsraum sowie ein praktisches Réduit.   \nSanitärbereich mit einer Dusche, zwei Toiletten und Lavabo.   \nFünf Parkplätze: 4 x ungedeckt, 1 x gedeckt   \nKüche/Teeküche: Bei einer Nutzung als Wohnatelier kann eine vollwertige Küche eingebaut werden (die Anschlüsse sind bereits vorhanden). Bei einer Büronutzung würde eine praktische Teeküche mehr Sinn machen. Beide Varianten würden von der Eigentümerin unter Einbezug der Mieterschaft eingebaut werden.   \nMitbenutzung an Aussenbereichen: Im naturnahen Waldbereich am Steilhang befindet sich eine Terrasse im 1. OG auf der Ostseite, ausgestattet mit Grill und Tischen.   \nVielseitige Nutzungsmöglichkeiten, zum Beispiel als Büro- oder Atelierräume (Architekturbüro, Grafik- oder Designatelier, IT-Supporter), Wohnatelier, Loftwohnung, Kreativ- oder Bewegungsraum.","oras":"Ittigen","npa":3063,"strada":"Pulverstrasse 8","tip":"OFFICE","tipDe":"Büro","catObj":"INDUSTRY","pret":"CHF 4’200","rentNet":3500,"rentNK":700,"rentBrut":4200,"supr":238,"camere":null,"etaj":3,"anCons":null,"anRenov":null,"disponibil":"agr","referinta":"..SI-25-234","agentie":"Schneller Immobilien AG","agentieLoc":"3011 Bern","dotari":["Lift"],"url":"https://flatfox.ch/de/wohnung/pulverstrasse-8-3063-ittigen/86100611/","folder":"B_buero_gewerbe/86100611-ittigen-238m-buero","imagini":[{"f":"01.jpg","cap":"Loft-/Atelierraum","w":0,"h":0},{"f":"02.jpg","cap":"Loft-/Atelierraum","w":0,"h":0},{"f":"03.jpg","cap":"Loft-/Atelierraum","w":0,"h":0},{"f":"04.jpg","cap":"Loft-/Atelierraum","w":0,"h":0},{"f":"05.jpg","cap":"Loft-/Atelierraum möbliert","w":0,"h":0},{"f":"06.jpg","cap":"Büro/Zimmer","w":0,"h":0},{"f":"07.jpg","cap":"Büro/Zimmer","w":0,"h":0},{"f":"08.jpg","cap":"Technikraum","w":0,"h":0},{"f":"09.jpg","cap":"Toiletten","w":0,"h":0},{"f":"10.jpg","cap":"Eingang","w":0,"h":0},{"f":"11.jpg","cap":"Aussenansicht","w":0,"h":0},{"f":"12.jpg","cap":"Parkplatz","w":0,"h":0},{"f":"13.jpg","cap":"Aussenansicht","w":0,"h":0}]},{"pk":1785311,"cat":"B_buero_gewerbe","catLabel":"Birou / gewerbe / atelier / coworking","praxis":false,"kwPraxis":[],"scor":1657.0,"regiune":"Cantonul Berna","titlu":"Worbstrasse 97, 3074 Muri b. Bern - auf Anfrage","scurt":"8026m² Gewerbe","pitch":"8026m² Gewerbe in Muri b. Bern mieten","descTitlu":"Vielseitig nutzbares Lager- und Gewerbegebäude zur Zwischennutzung in Muri (BE)","desc":"An gut erschlossener Lage an der Worbstrasse 97 in Muri wird ab Anfang 2027 ein vielseitig nutzbares Lager- und Gewerbegebäude zur Zwischennutzung angeboten. Mittelfristig ist eine umfassende Sanierung der Liegenschaft vorgesehen. Der genaue Zeitpunkt sowie die Umsetzung erfolgen jedoch in Abstimmung mit der zukünftigen Mieterschaft, wodurch sich interessante und planbare Nutzungsperspektiven ten","descTitlu":"5,5 Zimmer Wohnung und Gewerbeflächen teilbar ab 60qm zur Miete","desc":"Dieses attraktive Wohn- und Geschäftshaus in Herzogenbuchsee bietet eine einzigartige Möglichkeit mit vielfältigen Nutzungsmöglichkeiten. Es eignet sich perfekt für Ladengeschäfte, Werkstätten oder Unternehmer, die eine Kombination aus Wohnen und Arbeiten suchen. Das Gebäude kombiniert großzügiges Wohnen mit funktionalen Gewerbeflächen und zeichnet sich durch seine durchdachte Raumaufteilung, die hochwertigen Ausstattungsdetails und die hervorragende Lage aus. \n\nDas Gebäude wurde in massiver Bauweise errichtet und ist komplett unterkellert. \n\nIm Kellergeschoss befindet sich neben den Stauräumen eine befahrbare Tiefgarage, die Platz für 3 PKW bietet. \n\nEs teilt sich in 3 separat nutzbare Einheiten auf. \n\nEinheit 1: Im Erdgeschoss befindet sich eine Fläche mit 60qm bisher als Werkstatt genutzt wurde. Diese Teilfläche ist mit 3 Gruben ausgestattet. \n\nEinheit 2: \n\nVon einem Pausenraum mit 27qm getrennt befindet sich auf der anderen Gebäudeseite eine Ladenfläche mit ca. 183 qm, die über eine große Schaufensterfront zur Straße hin verfügt. Beide Gewerbeeinheiten verfügen über Starkstromanschlüsse. \n\nEinheit 3: \n\nIm OG und DG präsentiert sich eine Unternehmer Wohnung auf 209 qm mit 5,5 Zimmern, die auf zwei Ebenen viel Platz zum Entfalten bietet. Die sich auch gut in zwei Einheiten aufteilen lässt. Eine Überplanung durch einen Architekten wurde bereits vorgenommen und liegt vor. \n\nIn der modernen und hochwertigen Küche, die unter anderem mit Geräten von Gaggenau ausgestattet ist, können Sie sich und Ihre Familie kulinarisch verwöhnen. Im direkt angrenzenden Kaminzimmer können selbst kälteste Wintertage zum Genuss werden. Der große Wohn- Essbereich grenzt direkt an die riesige Dachterrasse an und verbindet im Sommer innen uns außen. Die Wohnung bietet auf der unteren Ebene ein Schlafzimmer und 2-3 auf der oberen Ebene. \n\nDas Objekt ist vielseitig nutzbar: Während das Erdgeschoss eine geräumige Gewerbefläche mit idealer Infrastruktur für Werkstatt, Laden oder Showroom bietet, überzeugt die Obergeschosswohnung als exklusive Duplex-Wohnung mit großem Wohnkomfort. Zusätzlich verfügt das Haus über eine große Tiefgarage sowie viel Lager- und Abstellfläche. \n\nAktuell steht das Gebäude leer und bietet so ideale Voraussetzungen für den Verkauf. Die Bausubstanz befindet sich in einem sehr guten Zustand. 2024 wurde das Flachdach und die darauf befindliche Terrasse komplett saniert und neu abgedichtet. \n\nFolgende Mietflächen stehen zur Anmietung: \n\n**Wohnung:** Wohnung: 174 m2 auf 2 Etagen, unten 115 m2, oben 59 m2 Terrasse: 141 m2 x 25% = 35 m2 Wohnung mit Terrasse: 174+35 = 209 m2 \n\n**Mietansatz: CHF 14.80 / m2: CHF 14.80 x 209 m2 = CHF 3093 Kaltmiete pro Monat**\n\n**Gewerbe Erdgeschoss:** Alle Räume EG: 243 m2 Fläche kann in 2 oder 3 Teile geteilt werden \n\n**Mietansatz: CHF 12 pro m2: 12 x 243 m2 = 2916 CHF Kaltmiete pro Monat**\n\n**UG Lagerräume:** Alle Räume im UG: 200 m2 \n\n**Mietansatz: CHF 8 pro m2: 8 x 200 m2 = 1600 CHF Kaltmiete pro Monat**","oras":"Herzogenbuchsee","npa":3360,"strada":"Farnsbergstrasse 1","tip":"LIVING_COMMERCIAL_BUILDING","tipDe":"Wohn-/Geschäftshaus","catObj":"INDUSTRY","pret":"auf Anfrage","rentNet":null,"rentNK":null,"rentBrut":null,"supr":652,"camere":null,"etaj":null,"anCons":1989,"anRenov":2015,"disponibil":"agr","referinta":"..r5bib.0tpnw","agentie":"LAYF GmbH","agentieLoc":"8048 Zürich","dotari":["Parkplatz","Garage / Einstellhalle"],"url":"https://flatfox.ch/de/wohnung/farnsbergstrasse-1-3360-herzogenbuchsee/85770311/","folder":"B_buero_gewerbe/85770311-herzogenbuchsee-652m-wohn-geschaeftshaus","imagini":[{"f":"01.png","cap":"House: single family house, red brick, brown roof, glass windows, solar panels, garage, street with cars","w":1500,"h":752},{"f":"02.png","cap":"A residential area with various houses, some with garages, surrounded by trees and grass, located near an intersection wi <script>
const DATE = JSON.parse(document.getElementById('data').textContent);
const grid = document.getElementById('grid'), qEl = document.getElementById('q');
const ov = document.getElementById('ov');
let filtre = {A:false, B:false, px:false, city:false, star:false};
let vizibile = [], idxCurent = -1;

/* localStorage arunca SecurityError cand pagina e deschisa dintr-un context
   fara origine (file:// in unele browsere, data:). Stelele sunt un accesoriu —
   nu au voie sa opreasca restul paginii, deci cad elegant pe memorie. */
const depozit = {
  ia(){ try { return JSON.parse(localStorage.getItem('stele') || '[]'); }
        catch(e){ return []; } },
  pune(v){ try { localStorage.setItem('stele', JSON.stringify(v)); } catch(e){} }
};
let stele = new Set(depozit.ia());

/* Normalizare pentru cautare: fara diacritice, cu umlaut-urile germane
   scrise si "ae/oe/ue", ca sa gaseasca "buro", "buero" si "Büro" la fel. */
const norm = s => (s||'').toLowerCase()
  .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'');

DATE.forEach(d => {
  d._s = norm([d.titlu,d.scurt,d.pitch,d.descTitlu,d.desc,d.oras,d.strada,d.npa,
               d.agentie,d.tipDe,d.tip,d.dotari.join(' ')].join(' '));
});

/* tipurile disponibile, in dropdown */
const tipSel = document.getElementById('tip');
[...new Set(DATE.map(d=>d.tipDe).filter(Boolean))].sort().forEach(t=>{
  const o=document.createElement('option'); o.value=t; o.textContent=t; tipSel.appendChild(o);
});

const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* evidentiaza termenii cautati, lucrand pe textul original */
function marcheaza(text, termeni){
  let out = esc(text);
  if(!termeni.length) return out;
  const re = new RegExp('(' + termeni.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')','gi');
  return out.replace(re, '<mark>$1</mark>');
}

function termeniCautare(){
  return qEl.value.trim().split(/\s+/).filter(t=>t.length>1);
}

function potrivit(d, termeni){
  if(filtre.A && d.cat[0] !== 'A') return false;
  if(filtre.B && d.cat[0] !== 'B') return false;
  if(filtre.px && !d.praxis) return false;
  if(filtre.city && !d.regiune.startsWith('Berna')) return false;
  if(filtre.star && !stele.has(d.pk)) return false;
  if(tipSel.value && d.tipDe !== tipSel.value) return false;
  return termeni.every(t => d._s.includes(norm(t)));
}

function fragment(d, termeni){
  if(!termeni.length) return d.descTitlu || d.desc.slice(0,150);
  const n = norm(d.desc), poz = n.indexOf(norm(termeni[0]));
  if(poz < 0) return d.descTitlu || d.desc.slice(0,150);
  return (poz>60?'…':'') + d.desc.slice(Math.max(0,poz-60), poz+150);
}

function randeaza(){
  const termeni = termeniCautare();
  vizibile = DATE.filter(d => potrivit(d, termeni));
  const s = document.getElementById('sort').value;
  if(s==='supr') vizibile.sort((a,b)=>(b.supr||0)-(a.supr||0));
  else if(s==='desc') vizibile.sort((a,b)=>b.desc.length-a.desc.length);
  else if(s==='oras') vizibile.sort((a,b)=>a.oras.localeCompare(b.oras,'de'));

  document.getElementById('count').textContent =
    vizibile.length + ' din ' + DATE.length + ' anunțuri' +
    (stele.size ? '  ·  ★ ' + stele.size : '');
  document.getElementById('empty').hidden = vizibile.length > 0;

  grid.innerHTML = vizibile.map((d,i)=>{
    const img = d.imagini[0];
    return `<article class="card" data-i="${i}">
      <div class="thumb">
        ${img ? `<img loading="lazy" src="${esc(d.folder)}/images/${esc(img.f)}" alt="">` : ''}
        <button class="star ${stele.has(d.pk)?'on':''}" data-pk="${d.pk}" title="Marchează">${stele.has(d.pk)?'★':'☆'}</button>
        ${d.imagini.length>1?`<span class="nimg">${d.imagini.length} poze</span>`:''}
      </div>
      <div class="body">
        <div class="badges">
          <span class="badge ${d.cat[0]}">${d.cat[0]==='A'?'Praxis':'Birou / Gewerbe'}</span>
          ${d.praxis && d.cat[0]!=='A' ? '<span class="badge px">praxis-relevant</span>':''}
          ${d.tipDe?`<span class="badge tip">${esc(d.tipDe)}</span>`:''}
        </div>
        <p class="ctitle">${marcheaza(d.descTitlu || d.scurt || d.titlu, termeni)}</p>
        <div class="cmeta">${marcheaza((d.strada?d.strada+', ':'')+(d.npa||'')+' '+d.oras, termeni)}
          ${d.supr?' · '+d.supr+' m²':''}</div>
        <div class="csnip">${marcheaza(fragment(d,termeni), termeni)}</div>
        <div class="cprice">${esc(d.pret)}</div>
      </div></article>`;
  }).join('');
}

/* ---------- detaliu ---------- */
function rand(v,u){ return (v===null||v===undefined||v==='') ? '' : v+(u||''); }

function deschide(i){
  if(i<0 || i>=vizibile.length) return;
  idxCurent = i;
  const d = vizibile[i], termeni = termeniCautare();
  document.getElementById('dtitle').textContent = (d.descTitlu || d.scurt) + ' — ' + d.oras;
  document.getElementById('dlink').href = d.url;
  const st = document.getElementById('dstar');
  st.textContent = stele.has(d.pk) ? '★' : '☆';
  st.classList.toggle('on', stele.has(d.pk));
  st.onclick = () => { comuta(d.pk); deschide(i); };

  document.getElementById('dgal').innerHTML = d.imagini.map(im=>
    `<figure><img loading="lazy" src="${esc(d.folder)}/images/${esc(im.f)}" alt="">
     ${im.cap?`<figcaption>${esc(im.cap)}</figcaption>`:''}</figure>`).join('')
    || '<p style="color:var(--ink3)">Fără imagini.</p>';

  const randuri = [
    ['Adresă', (d.strada?d.strada+', ':'')+(d.npa||'')+' '+d.oras],
    ['Regiune', d.regiune], ['Tip obiect', d.tip + (d.tipDe?' ('+d.tipDe+')':'')],
    ['Categorie obiect', d.catObj], ['Preț', d.pret],
    ['Chirie netă', rand(d.rentNet,' CHF')], ['Nebenkosten', rand(d.rentNK,' CHF')],
    ['Chirie brută', rand(d.rentBrut,' CHF')], ['Suprafață', rand(d.supr,' m²')],
    ['Camere', rand(d.camere)], ['Etaj', rand(d.etaj)],
    ['An construcție', rand(d.anCons)], ['An renovare', rand(d.anRenov)],
    ['Disponibil', d.disponibil], ['Referință', d.referinta],
    ['Ofertant', d.agentie + (d.agentieLoc?', '+d.agentieLoc:'')],
  ].filter(r=>r[1]!=='' && r[1]!=null && String(r[1]).trim()!=='');

  document.getElementById('dtxt').innerHTML =
    (d.pitch?`<h3>Pitch generat de portal</h3><p>${marcheaza(d.pitch,termeni)}</p>`:'') +
    (d.titlu?`<h3>Titlu public</h3><p>${marcheaza(d.titlu,termeni)}</p>`:'') +
    `<h3>Descriere (germană)</h3>` +
    (d.descTitlu?`<p><strong>${marcheaza(d.descTitlu,termeni)}</strong></p>`:'') +
    `<div class="desc">${marcheaza(d.desc,termeni)}</div>` +
    (d.kwPraxis.length?`<h3>Termeni praxis găsiți</h3><div class="tags">${
       d.kwPraxis.map(k=>`<span class="tag">${esc(k)}</span>`).join('')}</div>`:'') +
    (d.dotari.length?`<h3>Dotări</h3><div class="tags">${
       d.dotari.map(k=>`<span class="tag">${esc(k)}</span>`).join('')}</div>`:'') +
    `<h3>Date obiect</h3><table>${randuri.map(r=>
       `<tr><td>${esc(r[0])}</td><td>${esc(String(r[1]))}</td></tr>`).join('')}</table>`;

  document.getElementById('prev').disabled = i===0;
  document.getElementById('next').disabled = i===vizibile.length-1;
  ov.classList.add('open');
  document.querySelector('.pbody').scrollTop = 0;
  try { location.hash = d.pk; } catch(e){}   // deep-link, nu functionalitate
}

function inchide(){ ov.classList.remove('open'); idxCurent=-1;
  try { history.replaceState(null,'',location.pathname); } catch(e){} }

function comuta(pk){
  stele.has(pk) ? stele.delete(pk) : stele.add(pk);
  depozit.pune([...stele]);
  randeaza();
}

/* ---------- evenimente ---------- */
grid.addEventListener('click', e=>{
  const s = e.target.closest('.star');
  if(s){ e.stopPropagation(); comuta(+s.dataset.pk); return; }
  const c = e.target.closest('.card');
  if(c) deschide(+c.dataset.i);
});
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
  const f=b.dataset.f;
  filtre[f]=!filtre[f];
  if(f==='A'&&filtre.A) {filtre.B=false;}
  if(f==='B'&&filtre.B) {filtre.A=false;}
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',filtre[x.dataset.f]));
  randeaza();
}));
qEl.addEventListener('input', randeaza);
tipSel.addEventListener('change', randeaza);
document.getElementById('sort').addEventListener('change', randeaza);
document.getElementById('close').onclick = inchide;
document.getElementById('prev').onclick = ()=>deschide(idxCurent-1);
document.getElementById('next').onclick = ()=>deschide(idxCurent+1);
ov.addEventListener('click', e=>{ if(e.target===ov) inchide(); });
document.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement!==qEl){ e.preventDefault(); qEl.focus(); qEl.select(); }
  else if(e.key==='Escape'){ if(ov.classList.contains('open')) inchide(); else { qEl.value=''; randeaza(); } }
  else if(ov.classList.contains('open')){
    if(e.key==='ArrowRight') deschide(idxCurent+1);
    if(e.key==='ArrowLeft') deschide(idxCurent-1);
  }
});

/* ---------- pornire ---------- */
document.getElementById('stats').textContent =
  DATE.length + ' anunțuri · ' + DATE.reduce((s,d)=>s+d.imagini.length,0) + ' imagini · ' +
  DATE.filter(d=>d.cat[0]==='A').length + ' praxis · ' +
  DATE.filter(d=>d.praxis).length + ' praxis-relevante';
randeaza();
if(location.hash){
  const i = vizibile.findIndex(d=>String(d.pk)===location.hash.slice(1));
  if(i>=0) deschide(i);
}
</script>
</body>
</html>
